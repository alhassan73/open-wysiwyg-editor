name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # version PR + tags
      pull-requests: write
      id-token: write # npm Trusted Publishing (OIDC) + provenance — no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: SBOM
        run: npm sbom --sbom-format cyclonedx --workspace open-wysiwyg-editor > sbom.cdx.json
      - uses: changesets/action@v1
        with:
          publish: npx changeset publish
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
