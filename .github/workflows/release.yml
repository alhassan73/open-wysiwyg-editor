# Publishes packages/editor to npm when a version tag (v1.2.3) is pushed.
# Uses npm Trusted Publishing: GitHub proves the workflow's identity to npm (OIDC), so no npm
# token or 2FA code is needed, and the package gets a provenance attestation. One-time setup on
# npmjs.com → open-wysiwyg-editor → Settings → Trusted Publisher: GitHub Actions, user
# `alhassan73`, repository `open-wysiwyg-editor`, workflow `release.yml`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing support (11.5.1+)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p "require('./packages/editor/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Skip versions already on npm (e.g. published by hand)
        id: npm
        run: echo "published=$(npm view "open-wysiwyg-editor@${GITHUB_REF_NAME#v}" version 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - if: steps.npm.outputs.published == ''
        run: npm run check
      - if: steps.npm.outputs.published == ''
        run: npm run build
      - if: steps.npm.outputs.published == ''
        name: Bundle size budget
        run: node scripts/size-check.mjs
      - if: steps.npm.outputs.published == ''
        name: SBOM
        run: npm sbom --sbom-format cyclonedx --workspace open-wysiwyg-editor > sbom.cdx.json
      - if: steps.npm.outputs.published == ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - if: steps.npm.outputs.published == ''
        run: npm publish --workspace open-wysiwyg-editor --access public
